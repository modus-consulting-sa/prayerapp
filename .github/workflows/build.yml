name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: write
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      - name: Publish .geode as a release (downloadable without login)
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          files=$(find "$OUT_DIR" -name '*.geode')
          test -n "$files"
          gh release delete latest-build --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest-build $files -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Auto Complete (latest build)" \
            --notes "Built from $GITHUB_SHA"
